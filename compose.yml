services:
  frontend:
    image: ghcr.io/theoleuthardt/stitch-chart-creator-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080'
    depends_on:
      - backend

  backend:
    image: ghcr.io/theoleuthardt/stitch-chart-creator-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/stitchcharts
      DATABASE_USER: stitchcharts
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      - db

  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stitchcharts
      POSTGRES_USER: stitchcharts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stitchcharts']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql:U

volumes:
  db_data:
