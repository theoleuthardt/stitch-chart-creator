spring.application.name=stitch-chart-creator
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30d
spring.mvc.problemdetails.enabled=true
server.forward-headers-strategy=native
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
app.max-request-bytes=${MAX_REQUEST_BYTES:33554432}
app.large-request-bytes=1048576
app.large-request-slots=${LARGE_REQUEST_SLOTS:4}
